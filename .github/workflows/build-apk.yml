name: Android APK bauen

on:
  # workflow_dispatch allein reicht nicht, solange diese Datei noch nicht auf
  # dem Standardbranch liegt: GitHub findet einen manuell ausloesbaren
  # Workflow nur dort und antwortet sonst mit 404. Ein push-Trigger dagegen
  # wird aus der Fassung des gepushten Commits ausgewertet und laeuft sofort.
  # Deshalb hier zusaetzlich, eng auf den Build-Branch begrenzt, damit nicht
  # jeder Commit irgendwo im Projekt einen Android-Build ausloest.
  push:
    branches:
      - claude/eas-build
      - build-2026-07-30
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
    inputs:
      variant:
        description: "release = minifiziert, braucht die Keystore-Secrets · debug = sofort installierbar, selbstsigniert"
        required: true
        default: release
        type: choice
        options: [release, debug]
      allow_unconfigured:
        description: "Auch ohne WalletConnect-Projekt-ID bauen (die App hat dann keinen Wallet-verbinden-Knopf)"
        required: false
        default: false
        type: boolean

# Ein neuer Push bricht den noch laufenden Build desselben Branches ab. Ohne
# das laufen zwei Gradle-Builds nebeneinander, von denen der aeltere eine APK
# erzeugt, die niemand mehr will -- und zwar auf Runner-Zeit, die der neue
# Build gerade braucht.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Der Build laedt das halbe Android-Oekosystem; das Standard-Timeout von
    # 360 Minuten ist unnoetig grosszuegig, 45 reichen und decken einen
    # haengenden Gradle-Daemon auf, statt eine Stunde Runner-Zeit zu verheizen.
    timeout-minutes: 45

    env:
      # Bei einem Push gibt es keine inputs; ohne diesen Fallback waere die
      # Variable leer, und jede Abfrage darauf liefe ins Leere statt in einen
      # Fehler -- der Build wuerde still den falschen Typ erzeugen.
      VARIANT: ${{ inputs.variant || 'release' }}

      # Build-Konfiguration der App.
      #
      # Diese Werte landen im JS-Bundle und sind damit oeffentlich -- hier
      # gehoert nur hinein, was ohnehin jeder sehen darf (URLs, die
      # WalletConnect-Projekt-ID). Niemals ein Token oder ein privater
      # Schluessel.
      #
      # Warum das ueberhaupt hier stehen muss: lib/config.ts liest sie ueber
      # process.env.EXPO_PUBLIC_*. Lokal kommen sie aus .env.local, und die
      # ist gitignored, liegt also nicht im Repo. Ein CI-Build ohne diese
      # Weitergabe erzeugt eine App, in der WALLETCONNECT_PROJECT_ID leer ist
      # -- walletconnect.ts gibt dann `null` zurueck, WalletContext meldet
      # walletConnectAvailable=false, und der Verbinden-Knopf ist einfach
      # nicht mehr da. Genau das ist im ersten Release passiert.
      EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID }}
      EXPO_PUBLIC_COORDINATOR_BASE: ${{ vars.EXPO_PUBLIC_COORDINATOR_BASE }}
      # Fehlte hier, obwohl lib/config.ts es liest: ohne diese Zeile bleibt
      # BIOMETRIC_ENABLED im Bundle false, und der biometrische Weg ist in der
      # App nicht vorhanden -- selbst wenn COORDINATOR_BASE gesetzt ist. Beide
      # muessen zusammen kommen, sonst zeigt die App eine Registrierung an, die
      # sie nicht anbietet, oder bietet keine an, obwohl ein Coordinator laeuft.
      EXPO_PUBLIC_BIOMETRIC_ENABLED: ${{ vars.EXPO_PUBLIC_BIOMETRIC_ENABLED }}
      # Ohne diese Zeile war die Variable folgenlos, selbst wenn jemand sie
      # gesetzt haette: babel-preset-expo backt nur ein, was zur Bauzeit in der
      # Prozessumgebung steht. Genau daran scheiterte die Attestierung bisher
      # unbemerkt -- der Schluessel lag laut Projektnotizen seit dem 18.07.2026
      # bereit, erreichte die App aber nie.
      EXPO_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER: ${{ vars.EXPO_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER }}
      EXPO_PUBLIC_API_BASE: ${{ vars.EXPO_PUBLIC_API_BASE }}
      EXPO_PUBLIC_WEBAPP: ${{ vars.EXPO_PUBLIC_WEBAPP }}
      EXPO_PUBLIC_RPC_URL: ${{ vars.EXPO_PUBLIC_RPC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Expo 54 / React Native 0.81 setzen JDK 17 voraus. Die Runner haben
      # mehrere JDKs; ohne explizite Wahl greift Gradle irgendeines.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Das Android SDK ist auf ubuntu-latest vorinstalliert. Diese Action
      # setzt nur ANDROID_HOME und legt die Build-Tools in den PATH — sie
      # laedt kein SDK herunter, wenn schon eines da ist.
      - uses: android-actions/setup-android@v3

      # Vor allem anderen, weil ein hier uebersehener Fehler erst 25 Minuten
      # spaeter als fehlender Knopf in einer fertigen APK auffaellt -- und
      # zwar erst auf dem Geraet, nicht im Log.
      #
      # allow_unconfigured ist die bewusste Ausnahme fuer einen reinen
      # Kompiliertest. Sie muss man anfordern; sie passiert nicht von selbst.
      - name: Build-Konfiguration pruefen
        run: |
          if [ -z "$EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID" ]; then
            if [ "${{ inputs.allow_unconfigured }}" = "true" ]; then
              echo "::warning title=APK ohne WalletConnect::EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID ist nicht hinterlegt. In dieser APK fehlt der Wallet-verbinden-Knopf vollstaendig -- nur die lokale Wallet (Seed-Phrase) ist nutzbar. Bewusst zugelassen ueber allow_unconfigured."
            else
              echo "::error title=Kein WalletConnect-Projekt-ID::Das Repository-Secret EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID fehlt. Ohne sie liefert lib/walletconnect.ts null, WalletContext meldet walletConnectAvailable=false, und der Verbinden-Knopf ist in der fertigen App nicht vorhanden. Secret hinterlegen (Settings -> Secrets and variables -> Actions) oder den Build mit allow_unconfigured=true starten, wenn das gewollt ist."
              exit 1
            fi
          fi

          # GERAETE-ATTESTIERUNG: lieber sichtbar fehlend als still behauptet.
          #
          # lib/attestation.ts liest EXPO_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER und
          # gibt ohne sie null zurueck -- die App schickt dann kein Token, und
          # der Coordinator vermerkt attestation_status "not_configured". Diese
          # Variable ist in diesem Repository nie gesetzt gewesen und wurde von
          # diesem Workflow bis heute nicht einmal durchgereicht, also lief Play
          # Integrity in KEINER ausgelieferten APK -- waehrend die Release-Notiz
          # zu v1.5.0 schrieb, die Attestierung laufe "jetzt mit".
          #
          # Kein Abbruch: die Attestierung ist erklaertermassen nur ein
          # Risikosignal und niemals eine Huerde (Geraetequalitaet darf ueber
          # Personenhaftigkeit nicht entscheiden). Ein fehlendes Signal ist also
          # kein Grund, niemanden zu registrieren -- wohl aber einer, es nicht
          # als vorhanden auszuweisen.
          if [ -z "$EXPO_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER" ]; then
            echo "::warning title=APK ohne Geraete-Attestierung::EXPO_PUBLIC_GOOGLE_CLOUD_PROJECT_NUMBER ist nicht gesetzt. getAttestationPayload() liefert null, die App sendet kein Play-Integrity-Token, und der Coordinator sieht attestation_status=not_configured. Das blockiert niemanden -- aber diese APK darf nicht als attestiert beschrieben werden. Zum Aktivieren: Repository-Variable mit der GCP-Projektnummer anlegen."
          fi

          # Railway ist am 14.08.2026 abgeschaltet worden und hostet keinen
          # Teil dieses Netzwerks mehr (siehe docs/MIGRATION_RAILWAY_TO_CONTABO.md
          # im Chain-Repo). Eine EXPO_PUBLIC_*-Variable landet per
          # babel-preset-expo fest im JS-Bundle -- ein toter Host faellt
          # deshalb nicht beim Deploy auf, sondern erst in der Hand des
          # Nutzers, als App, die gegen nichts mehr spricht.
          #
          # Am 15.08.2026 live vorgefunden: die Repository-Variable
          # EXPO_PUBLIC_COORDINATOR_BASE zeigte auf
          # coordinator-production-dcd1.up.railway.app, das mit
          # {"status":"error","code":404,"message":"Application not found"}
          # antwortet -- bei gleichzeitig EXPO_PUBLIC_BIOMETRIC_ENABLED=true.
          # Die App haette also eine Registrierung angeboten, die nach
          # mehreren Minuten Erfassung zwangslaeufig fehlschlaegt.
          #
          # lib/__tests__/config.test.ts prueft dasselbe noch einmal im
          # Testlauf; hier steht es zusaetzlich, weil dieser Schritt vor
          # `npm ci` laeuft und damit Minuten frueher abbricht.
          # FIX (23.08.2026): dieser Schutz lehnte jeden *.railway.app ab, mit der
          # Begruendung "Railway ist seit 14.08. abgeschaltet". Fuer die KETTE
          # stimmt das. Fuer den Biometrie-Stack nicht: das Railway-Projekt
          # aequitas-matching laeuft weiter und ist der EINZIGE erreichbare
          # Coordinator -- /challenge liefert dort eine echte Liveness-Aufgabe,
          # /register nennt die fehlenden Pflichtfelder.
          #
          # Der Schutz hat also einen lebenden Host blockiert, weil er den
          # Namen prueft statt die Erreichbarkeit. Umgekehrt haette er einen
          # toten Contabo-Endpunkt anstandslos durchgelassen.
          #
          # Jetzt wird gefragt, ob die Adresse ANTWORTET. Das ist der Test, um
          # den es eigentlich ging, und er faengt jede tote URL statt nur die
          # eines Anbieters.
          #
          # WARUM DER KOERPER UND NICHT NUR DER STATUSCODE: die Variable stand
          # kurzzeitig auf https://aequitas.digital/coordinator, wo /health,
          # /challenge und /register alle 200 lieferten -- die Landing-Page des
          # Knotens, die auf JEDEN Pfad HTML ausliefert. Eine 200, die nicht das
          # ist, wonach gefragt wurde. Ein Coordinator antwortet mit JSON.
          fail=0
          for var in EXPO_PUBLIC_API_BASE EXPO_PUBLIC_WEBAPP EXPO_PUBLIC_RPC_URL EXPO_PUBLIC_COORDINATOR_BASE; do
            value="${!var}"
            [ -n "$value" ] || continue
            case "$value" in
              http://*|https://*) ;;
              *) echo "::error title=Keine absolute URL in $var::'$value'"; fail=1; continue ;;
            esac
            probe="$value/health"
            body=$(curl -s -L --max-time 25 "$probe" | head -c 400)
            code=$(curl -s -L -o /dev/null --max-time 25 -w '%{http_code}' "$probe")
            if [ "$code" != "200" ]; then
              echo "::error title=Toter Host in $var::$var zeigt auf '$value'. $probe antwortet mit HTTP $code. Die URL wird fest ins JS-Bundle gebacken -- ein toter Host faellt nicht beim Deploy auf, sondern erst in der Hand des Nutzers."
              fail=1
              continue
            fi
            case "$body" in
              *'<!DOCTYPE'*|*'<html'*)
                echo "::error title=HTML statt JSON in $var::$probe antwortet mit 200, liefert aber eine HTML-Seite. Das ist der Catch-all eines Webservers, nicht der Dienst -- die App bekaeme HTML, wo sie JSON erwartet."
                fail=1
                ;;
              *) echo "  $var: $probe antwortet mit 200 und liefert kein HTML" ;;
            esac
          done
          [ "$fail" -eq 0 ] || exit 1

          {
            echo "### Build-Konfiguration"
            echo ""
            echo "| Variable | Zustand |"
            echo "|---|---|"
            echo "| WalletConnect-Projekt-ID | $([ -n "$EXPO_PUBLIC_WALLETCONNECT_PROJECT_ID" ] && echo 'gesetzt' || echo '**fehlt — kein WalletConnect**') |"
            echo "| Coordinator | ${EXPO_PUBLIC_COORDINATOR_BASE:-_nicht gesetzt — biometrischer Weg wird nicht angeboten_} |"
            echo "| API | ${EXPO_PUBLIC_API_BASE:-https://aequitas.digital/api (Standard)} |"
            echo "| RPC | ${EXPO_PUBLIC_RPC_URL:-https://aequitas.digital/rpc (Standard)} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abhaengigkeiten installieren
        # npm 10 (gebuendelt mit Node 20) bricht an diesem Lockfile ab: es
        # will die optionalen `async-storage: 1.x`-Peers von
        # @walletconnect/keyvaluestorage nachziehen, findet sie nicht im Lock
        # und meldet "Missing: @react-native-async-storage/async-storage@
        # 1.24.0 from lock file". Geschrieben wurde das Lockfile mit npm 11,
        # das diese Peers gar nicht erst aufloest.
        run: |
          npm install -g npm@11
          npm ci

      # Vor dem teuren Android-Build. Ein Tippfehler in einer Uebersetzung
      # oder ein Typfehler faellt hier nach Sekunden auf statt nach zwanzig
      # Minuten Gradle — und zwar mit einer Fehlermeldung, die die Ursache
      # nennt, statt mit einem Metro-Bundlerfehler tief im Gradle-Log.
      - name: Typen und Tests pruefen
        run: |
          npx tsc --noEmit
          npx jest --ci

      # Managed Expo-Projekt ohne android/-Verzeichnis: das native Projekt
      # wird aus app.json erzeugt. --clean, damit kein Rest eines frueheren
      # Laufs stillschweigend mitgebaut wird.
      - name: Natives Android-Projekt erzeugen
        run: npx expo prebuild --platform android --clean --no-install

      - name: Bauen
        working-directory: android
        run: |
          chmod +x ./gradlew

          # FIX: der Build starb reproduzierbar mit
          #   java.lang.OutOfMemoryError: Java heap space
          # in :app:packageRelease -- also ganz am Ende, nach 30 Minuten Arbeit.
          #
          # Ein frueherer Lauf schien das durch einen simplen Neustart zu
          # ueberleben; das war kein Beweis, sondern ein kleinerer Build. Mit
          # aktiver Gesichtspruefung (EXPO_PUBLIC_BIOMETRIC_ENABLED) bleibt mehr
          # Code und mehr Asset erhalten, und seitdem scheitert es zuverlaessig.
          #
          # expo prebuild erzeugt android/ neu, also ist jede Aenderung an einer
          # eingecheckten gradle.properties wirkungslos -- der Wert muss HIER
          # gesetzt werden, nach prebuild und vor gradlew.
          #
          # 6 GB reichten nicht dauerhaft. Am 23.08.2026 scheiterte
          # :app:packageRelease erneut mit "Java heap space" -- nach 36 Minuten,
          # am letzten Schritt, bei einem Stand, der GEGENUEBER dem letzten
          # gruenen Build nur Code ENTFERNT hatte. Der Bedarf ist also nicht
          # gewachsen; 6 GB lagen schlicht so dicht an der Grenze, dass derselbe
          # Build mal durchlief und mal nicht. Eine Zahl, die in der Haelfte der
          # Faelle reicht, ist keine Loesung, sondern eine Verabredung zum
          # naechsten Fehlschlag.
          #
          # 8 GB auf einem Runner mit 16 GB laesst weiterhin genug fuer den
          # Kernel-Cache, ohne den das Schreiben derselben 215-MB-APK spuerbar
          # langsamer wird.
          echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" >> gradle.properties
          echo "--- wirksame JVM-Einstellungen ---"
          grep '^org.gradle.jvmargs' gradle.properties
          if [ "$VARIANT" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: APK finden
        id: apk
        run: |
          # -print -quit statt head: bricht bei der ersten Fundstelle ab und
          # vermeidet ein SIGPIPE, das den Schritt rot faerben wuerde.
          path=$(find android/app/build/outputs/apk -name '*.apk' -print -quit)
          if [ -z "$path" ]; then
            echo "::error::Kein APK erzeugt — Gradle-Ausgabe oben pruefen."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Handmodell in der APK pruefen
        run: |
          # Ohne diese Pruefung faellt ein fehlendes Modell erst auf dem Geraet
          # auf, und dann mit einer Meldung, die woanders hinzeigt: MediaPipe
          # sucht "hand_landmarker.task" unter den Assets, findet es nicht,
          # behandelt den Namen als Dateipfad und meldet "doesn't have a slash
          # in it". Genau das ist passiert -- die Datei lag nur im gitignorten
          # android/-Ordner eines Entwicklerrechners und war in jeder CI-APK
          # abwesend, waehrend die Handerkennung lokal funktionierte.
          if unzip -l "${{ steps.apk.outputs.path }}" | grep -q 'hand_landmarker.task'; then
            size=$(unzip -l "${{ steps.apk.outputs.path }}" | grep 'hand_landmarker.task' | awk '{print $1}')
            echo "Handmodell in der APK: ${size} Bytes"
          else
            echo "::error title=Handmodell fehlt::hand_landmarker.task ist nicht in der APK. Die Handerkennung wuerde auf dem Geraet mit einer irrefuehrenden Pfad-Meldung scheitern. Der Gradle-Task downloadHandLandmarker in modules/mediapipe-hand-detector/android/build.gradle sollte es beschaffen -- dessen Ausgabe oben pruefen."
            exit 1
          fi

      # Nachtraeglich signieren statt Gradle umzukonfigurieren.
      #
      # Der Grund: `expo prebuild` erzeugt eine build.gradle, in der
      # buildTypes.release ausdruecklich signingConfigs.debug verwendet.
      # Eigene Eintraege in gradle.properties aendern daran NICHTS -- sie
      # werden schlicht nie gelesen. Ein Build, der so tut, als haette er den
      # echten Schluessel benutzt, waere schlimmer als gar keiner. apksigner
      # ersetzt die vorhandene Signatur und ist unabhaengig davon, was die
      # generierte build.gradle gerade tut.
      #
      # Was hier auf dem Spiel steht: Android verweigert ein Update, dessen
      # Signatur nicht zur installierten passt. Wer mit fremdem Schluessel
      # signiert, zwingt bestehende Nutzer zum Deinstallieren -- und das
      # loescht das geraetegebundene Geheimnis und damit ihre Identitaet.
      - name: Mit Release-Schluessel signieren
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          if [ "$VARIANT" != "release" ]; then
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "signed=debug-key" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release-Build mit Debug-Schluessel::ANDROID_KEYSTORE_BASE64 ist nicht hinterlegt. Der Build-Typ ist release (minifiziert, ohne Debug-Symbole), signiert wird aber mit dem Debug-Schluessel der Expo-Vorlage. Fuer einen Geraetetest in Ordnung; ein Update bestehender Installationen ist damit NICHT moeglich."
            exit 0
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::apksigner nicht gefunden — ohne Build-Tools laesst sich nicht signieren."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass "pass:$KEY_PASSWORD" \
            "$APK"
          # Ohne diese Pruefung wuerde eine fehlgeschlagene Signatur erst auf
          # dem Geraet auffallen, mit einer Fehlermeldung des Installers, die
          # die Ursache nicht nennt.
          "$apksigner" verify --print-certs "$APK"
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "signed=upload-key" >> "$GITHUB_OUTPUT"

      - name: Zusammenfassung
        env:
          APK: ${{ steps.apk.outputs.path }}
        run: |
          {
            echo "### APK gebaut"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Datei | \`$(basename "$APK")\` |"
            echo "| Groesse | $(du -h "$APK" | cut -f1) |"
            echo "| Build-Typ | $VARIANT |"
            echo "| Signatur | ${{ steps.sign.outputs.signed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: aequitas-${{ inputs.variant || 'release' }}-apk
          path: ${{ steps.apk.outputs.path }}
          # Standard sind 90 Tage. Eine APK dieser App sollte nicht
          # monatelang abrufbar herumliegen.
          retention-days: 14
          if-no-files-found: error
