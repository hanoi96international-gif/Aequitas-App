name: Android APK bauen

# Manuell ausgeloest, nicht bei jedem Push: ein Android-Build dauert Minuten
# und verbraucht Runner-Zeit; bei jedem Commit zu bauen waere Verschwendung,
# solange niemand die Artefakte abholt.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug = sofort installierbar, selbstsigniert · release = braucht die Keystore-Secrets"
        required: true
        default: debug
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest
    # Der Build laedt das halbe Android-Oekosystem; das Standard-Timeout von
    # 360 Minuten ist unnoetig grosszuegig, 45 reichen und decken einen
    # haengenden Gradle-Daemon auf, statt eine Stunde Runner-Zeit zu verheizen.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Expo 54 / React Native 0.81 setzen JDK 17 voraus. Die Runner haben
      # mehrere JDKs; ohne explizite Wahl greift Gradle irgendeines.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Das Android SDK ist auf ubuntu-latest vorinstalliert. Diese Action
      # setzt nur ANDROID_HOME und legt die Build-Tools in den PATH — sie
      # laedt kein SDK herunter, wenn schon eines da ist.
      - uses: android-actions/setup-android@v3

      - name: Abhaengigkeiten installieren
        run: npm ci

      # Managed Expo-Projekt ohne android/-Verzeichnis: das native Projekt
      # wird aus app.json erzeugt. --clean, damit ein Rest aus einem frueheren
      # Lauf nicht stillschweigend mitgebaut wird.
      - name: Natives Android-Projekt erzeugen
        run: npx expo prebuild --platform android --clean --no-install

      # Nur fuer release: der Keystore kommt aus den Repository-Secrets.
      # OHNE diese Secrets signiert Gradle einen Release-Build mit dem
      # Debug-Schluessel — die APK laesst sich installieren, ist aber NICHT
      # dieselbe Signatur wie ein bisheriges Release. Bestehende Nutzer
      # koennten damit nicht aktualisieren, sondern muessten deinstallieren,
      # und genau das vernichtet bei dieser App das geraetegebundene
      # Geheimnis und damit die Identitaet.
      - name: Keystore einspielen
        if: inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 ist nicht gesetzt. Ein Release-Build wuerde mit dem Debug-Schluessel signiert und waere fuer bestehende Installationen kein gueltiges Update. Entweder die Secrets hinterlegen oder variant=debug waehlen."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Signatur konfigurieren
        if: inputs.variant == 'release'
        run: |
          cat >> android/gradle.properties <<EOF
          AEQ_UPLOAD_STORE_FILE=release.keystore
          AEQ_UPLOAD_STORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AEQ_UPLOAD_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}
          AEQ_UPLOAD_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Bauen
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ "${{ inputs.variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: APK finden
        id: apk
        run: |
          # -print -quit statt head: bricht bei der ersten Fundstelle ab und
          # vermeidet ein SIGPIPE in find, das den Schritt rot faerben wuerde.
          path=$(find android/app/build/outputs/apk -name '*.apk' -print -quit)
          if [ -z "$path" ]; then
            echo "::error::Kein APK erzeugt — Gradle-Ausgabe oben pruefen."
            exit 1
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "APK: $path ($(du -h "$path" | cut -f1))"

      - uses: actions/upload-artifact@v4
        with:
          name: aequitas-${{ inputs.variant }}-apk
          path: ${{ steps.apk.outputs.path }}
          # Standard sind 90 Tage. Eine APK dieser App ist nichts, was
          # monatelang abrufbar herumliegen sollte.
          retention-days: 14
          if-no-files-found: error
