name: APK als Release veroeffentlichen

# Nimmt das Artefakt eines bereits gelaufenen Builds und macht daraus ein
# GitHub-Release. Bewusst getrennt vom Build: ein Build soll man beliebig oft
# laufen lassen koennen, ohne dass dabei etwas oeffentlich wird.
#
# WARUM DAS ARTEFAKT UND NICHT EIN NEUER BUILD. Ein Release muss genau die APK
# enthalten, die jemand geprueft hat. Ein frischer Build waere eine ANDERE
# Datei -- gleiche Quellen, andere Zeitstempel und andere Signatur -- und damit
# waere die Pruefung wertlos.
#
# SIGNATUR, ehrlich benannt: solange ANDROID_KEYSTORE_BASE64 nicht hinterlegt
# ist, signiert der Build mit dem Debug-Schluessel der Expo-Vorlage. Alle
# bisherigen Releases sind so signiert, ein Update zwischen ihnen funktioniert
# also. Ein spaeterer Wechsel auf einen echten Release-Schluessel zwingt
# bestehende Nutzer EINMALIG zum Deinstallieren -- das ist der Preis dafuer,
# ihn nicht von Anfang an gehabt zu haben, und er wird nicht kleiner.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run-ID des Builds, dessen APK veroeffentlicht werden soll"
        required: true
      tag:
        description: "Tag fuer das Release, z. B. app-v1.4.0"
        required: true
      notes:
        description: "Was sich geaendert hat (eine Zeile reicht)"
        required: false
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Artefakt des Builds holen
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/apk
          merge-multiple: true

      - name: Pruefen, was da eigentlich liegt
        id: check
        run: |
          set -euo pipefail
          APK=$(find /tmp/apk -name '*.apk' -type f | head -1)
          if [ -z "$APK" ]; then
            echo "Kein APK im Artefakt von Run ${{ inputs.run_id }} gefunden."
            find /tmp/apk -type f | head -20
            exit 1
          fi
          SIZE=$(stat -c %s "$APK")
          # Eine APK dieser App liegt bei ~85 MB. Alles unter 10 MB ist kein
          # vollstaendiger Build, sondern ein abgebrochener -- und den will
          # niemand als Release herunterladen.
          if [ "$SIZE" -lt 10000000 ]; then
            echo "APK ist nur $SIZE Bytes gross -- das ist kein vollstaendiger Build."
            exit 1
          fi
          cp "$APK" /tmp/app-release.apk
          echo "size=$(numfmt --to=iec "$SIZE")" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum /tmp/app-release.apk | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "APK: $APK ($SIZE Bytes)"
          # Wer hat signiert? Aus der APK gelesen, nicht behauptet: bis
          # app-v0.3.1-phase0 stand in jeder Notiz "Debug-Schluessel der
          # Expo-Vorlage", waehrend der Build seit v1.6.0 mit dem eigenen
          # Release-Schluessel signiert. Eine Notiz, die das Gegenteil des
          # Builds sagt, ist schlimmer als keine.
          RSA=$(unzip -Z1 /tmp/app-release.apk 'META-INF/*.RSA' 'META-INF/*.EC' 2>/dev/null | head -1 || true)
          if [ -n "$RSA" ]; then
            CERT=$(unzip -p /tmp/app-release.apk "$RSA" | openssl pkcs7 -inform DER -print_certs 2>/dev/null || true)
            FP=$(echo "$CERT" | openssl x509 -noout -fingerprint -sha256 2>/dev/null | cut -d= -f2 | tr -d ':' | tr 'A-F' 'a-f')
            SUBJ=$(echo "$CERT" | openssl x509 -noout -subject 2>/dev/null | sed 's/^subject=//')
          fi
          echo "signer=${SUBJ:-unbekannt}" >> "$GITHUB_OUTPUT"
          echo "fingerprint=${FP:-unbekannt}" >> "$GITHUB_OUTPUT"
          echo "Signiert von: ${SUBJ:-unbekannt} (${FP:-unbekannt})"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Ueber die Umgebung, nicht als ${{ }} im Skript: als Text ins Skript
          # eingesetzt, wurden Klammern und Backticks in den Notizen zu
          # Shell-Syntax -- "syntax error near unexpected token `('" am
          # 13.09.2026, und die Notizen einer Version mit `Code` darin waren
          # damit gar nicht veroeffentlichbar.
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "$NOTES"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Groesse | ${{ steps.check.outputs.size }} |"
            echo "| SHA-256 | \`${{ steps.check.outputs.sha256 }}\` |"
            echo "| Gebaut aus | Run [${{ inputs.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ inputs.run_id }}) |"
            echo ""
            echo "Signiert von \`${{ steps.check.outputs.signer }}\`, SHA-256 \`${{ steps.check.outputs.fingerprint }}\`."
            if [ "${{ steps.check.outputs.fingerprint }}" = "473e9de3a5ba2077d176af95daed88be50c0789815e35428d1c185ae2fc95288" ]; then
              echo "Das ist der eigene Release-Schluessel (seit app-v1.6.0): ein Update von v1.6.0 oder neuer"
              echo "funktioniert normal. Von v1.5.x oder aelter (Debug-Schluessel) einmal deinstallieren --"
              echo "vorher die Seed-Phrase sichern."
            else
              echo "ACHTUNG: das ist NICHT der Release-Schluessel von app-v1.6.0 -- ein Update von dort"
              echo "wird Android ablehnen. Nur veroeffentlichen, wenn das Absicht ist."
            fi
          } > /tmp/notes.md

          # DEN TAG AN DEN COMMIT HAENGEN, AUS DEM DIE APK WIRKLICH STAMMT.
          #
          # Ohne --target legt gh den Tag auf die Spitze des STANDARDZWEIGS
          # (hier aequitas-app), voellig unabhaengig davon, woraus gebaut
          # wurde. Solange Build und Standardzweig dieselben waren, fiel das
          # nicht auf. Beim ersten Release aus einem anderen Zweig
          # (app-v1.7.3, 20.09.2026) zeigte der Tag dann auf den Vorgaenger:
          # die APK trug die zwei Registrierungsfixes, der Tag wies auf
          # Quellcode ohne sie.
          #
          # Ein Release, dessen Tag nicht auf seine eigene Quelle zeigt, ist
          # nicht pruefbar -- und Pruefbarkeit ist bei einer Wallet-App kein
          # Beiwerk. Der Commit steht im Build-Lauf; von dort wird er geholt.
          ziel="$(gh api "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}" --jq .head_sha)"
          if [ -z "$ziel" ]; then
            echo "::error title=Kein Commit zum Build gefunden::Run ${{ inputs.run_id }} liefert keinen head_sha -- ohne ihn wuerde der Tag auf den Standardzweig zeigen statt auf die gebaute Quelle."
            exit 1
          fi
          echo "Tag wird auf $ziel gesetzt (Commit des Build-Laufs ${{ inputs.run_id }})"

          gh release create "${{ inputs.tag }}" /tmp/app-release.apk \
            --repo "${{ github.repository }}" \
            --target "$ziel" \
            --title "Aequitas App ${{ inputs.tag }}" \
            --notes-file /tmp/notes.md

          echo "### Release veroeffentlicht" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/app-release.apk" >> "$GITHUB_STEP_SUMMARY"
