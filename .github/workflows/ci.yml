name: CI

# FIX (fresh Monster Audit 2026-07-12): this app had no CI workflow at all —
# a red typecheck or lint error could sit unnoticed on any branch. Scoped to
# what's verifiable without additional infrastructure (signing keys, EAS
# credentials): typecheck + lint + unit tests. No Android assemble step —
# adding one that isn't wired to real signing config would just be a second
# gate that fails for infrastructure reasons unrelated to code correctness —
# see the aequitas-chain repo's own deploy-contabo.yml Node-version incident
# for exactly why an unverified CI gate is worse than no gate.
#
# UPDATE (2026-07-13): jest-expo test infra added (lib/__tests__/*), so the
# "no test suite yet" caveat this comment used to have no longer applies.
on:
  push:
  pull_request:

jobs:
  typecheck-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo lint
      - run: npx jest
